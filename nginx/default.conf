# ローカル開発用の nginx 設定。
# 受け取ったリクエストのうち、ファイルとして存在するもの（画像など）はそのまま返し、
# それ以外はすべて Laravel の入口（public/index.php）に渡す。

server {
    listen 80;
    server_name _;

    # Laravel の公開ディレクトリ。ここより上（.env や app/ など）は外から見えない
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    location / {
        # 1. そのパスのファイルがあれば返す（$uri）
        # 2. ディレクトリがあれば返す（$uri/）
        # 3. どちらも無ければ index.php に渡す（/api/calendar などはすべてここ）
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # php-fpm（docker-compose.yml の backend サービス）の 9000番に渡す
        fastcgi_pass backend:9000;
        # 実行する PHP ファイルのパス
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # リクエストの情報（メソッド・クエリなど）を PHP に渡す標準の設定。
        # リクエストヘッダーは FastCGI では自動的に HTTP_* として渡るので、
        # X-Forwarded-For（B12: 利用者の本当の IP）も HTTP_X_FORWARDED_FOR として Laravel に届く。
        include fastcgi_params;
    }

    # .env や .git などのドットファイルは返さない（.well-known だけは例外）
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
